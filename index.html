<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ejemplo de obligatorio para FIS ORT 2023."
    />
    <title>Canciones</title>
    <link rel="icon" href="src/interface/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="src/interface/style.css" rel="stylesheet" />
  </head>

  <body>
    <nav class="navbar navbar-expand">
      <a class="navbar-brand ps-2" href="#">Canciones</a>
      <div class="nav nav-pills" id="nav-tab" role="tablist">
        <button
          class="nav-link active me-3"
          id="nav-add-song-tab"
          data-bs-toggle="tab"
          data-bs-target="#nav-add-song"
          type="button"
          role="tab"
          aria-controls="nav-add-song"
          aria-selected="true"
        >
          Agregar canción
        </button>
        <button
          class="nav-link"
          id="nav-songs-list-tab"
          data-bs-toggle="tab"
          data-bs-target="#nav-songs-list"
          type="button"
          role="tab"
          aria-controls="nav-songs-list"
          aria-selected="false"
        >
          Lista de canciones
        </button>
      </div>
    </nav>
    <div class="tab-content" id="nav-tabContent">
      <div
        class="tab-pane fade show active"
        id="nav-add-song"
        role="tabpanel"
        aria-labelledby="nav-add-song-tab"
      >
        <div class="row justify-content-end px-5" style="width: 100%">
          <div class="col-8 col-lg-4 col-xs-8" id="alerts"></div>
        </div>
        <div class="container shadow bg-white rounded">
          <div class="row">
            <div class="col-sm p-0 fill">
              <img
                src="./src/interface/img/music.jpg"
                alt="Auriculares y disco de vinilo"
                id="add-songs-image"
                class="rounded-start"
              />
            </div>
            <div class="col-sm pt-2 px-4">
              <h1 class="title">Registro de canciones</h1>
              <form id="register-form">
                <div class="row">
                  <div class="col-sm">
                    <label for="inp-title" class="form-label">Título:</label>
                    <input
                      type="text"
                      class="form-control"
                      id="inp-title"
                      name="title"
                      placeholder="Ingrese el título"
                      required
                    />
                  </div>
                </div>
                <div class="row">
                  <div class="col-sm pt-3">
                    <label for="inp-artist" class="form-label">Artista:</label>
                    <input
                      type="text"
                      class="form-control"
                      id="inp-artist"
                      name="artist"
                      placeholder="Ingrese el artista"
                      required
                    />
                  </div>
                </div>
                <div class="row">
                  <div class="col-sm pt-3">
                    <label for="inp-year" class="form-label">Año:</label>
                    <input
                      type="number"
                      class="form-control"
                      id="inp-year"
                      name="year"
                      placeholder="Ingrese el año"
                      required
                    />
                  </div>
                </div>
                <div class="d-none" id="add-songs-error">
                  <p class="text-danger pt-2" id="add-songs-error-msg"></p>
                </div>
                <div class="row-sm py-3 text-end">
                  <button id="btn-add" type="button" class="btn btn-primary">
                    Agregar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      <div
        class="tab-pane fade"
        id="nav-songs-list"
        role="tabpanel"
        aria-labelledby="nav-songs-list-tab"
      >
        <h2
          class="position-absolute top-50 start-50 translate-middle"
          id="empty-list"
        >
          No ha ingresado ninguna canción :(
        </h2>
        <div
          id="songs"
          class="container shadow bg-white rounded mt-4 p-2 d-none"
        >
          <h1 class="title ps-2">Canciones:</h1>
          <ul id="songs-list" class="list-group-numbered"></ul>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="src/interface/main.ts" type="module"></script>
  </body>
</html>
